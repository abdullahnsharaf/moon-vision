[project]
name = "moon-vision"
version = "1.1.0"
description = "Moon phase and brightness from a photo: OpenCV segmentation + ONNX CNN, served by FastAPI"
requires-python = ">=3.12"
# Runtime only. Training needs PyTorch: pip install -r requirements-train.txt
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "onnxruntime>=1.17",
]

[tool.vercel]
entrypoint = "backend.app:app"
